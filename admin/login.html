<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raza Admin Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#11110f;color:#fff;font-family:Arial,sans-serif}.box{width:min(410px,92vw);padding:36px;background:#191915;border:1px solid #36352f;border-radius:24px;box-shadow:0 25px 80px #0008}.mark{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f1cd55,#b98500);color:#111;font-size:21px;font-weight:900}.eyebrow{font-size:8px;letter-spacing:2px;color:#888;margin-top:24px}.box h1{margin:7px 0;font-size:30px}.box p{font-size:12px;color:#888}.field{display:grid;gap:7px;margin-top:16px}.field label{font-size:9px;color:#aaa;font-weight:700;letter-spacing:1px}.field input{padding:14px;border:1px solid #3b3a34;border-radius:10px;background:#11110f;color:#fff;outline:none}.btn{width:100%;margin-top:20px;border:0;border-radius:999px;padding:14px;background:#d9aa19;color:#111;font-weight:900;cursor:pointer}.error{color:#e78c83;font-size:10px;margin-top:12px;min-height:15px}</style></head><body><main class="box"><div class="mark">R</div><div class="eyebrow">RAZA MOBILE & ELECTRONICS</div><h1>Admin Control</h1><p>Sign in to manage products, images and your catalogue.</p><form id="login"><div class="field"><label>EMAIL</label><input id="email" type="email" value="razamobile@gmail.com" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" required autocomplete="current-password"></div><div id="error" class="error"></div><button class="btn">Sign in →</button></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://iljmxsfcjuutppftsrrt.supabase.co';const KEY=['sb_publishable_','g4l-OO-1x1X4LMM-','c5cnXA_DItmM14F'].join('');const form=document.getElementById('login');form.onsubmit=async e=>{e.preventDefault();const er=document.getElementById('error');er.textContent='Signing in…';try{const sb=supabase.createClient(SUPABASE_URL,KEY);const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;location.href='/admin/'}catch(x){er.textContent=x.message}};</script></body></html>

<script>
(async()=>{const S='https://iljmxsfcjuutppftsrrt.supabase.co',K='sb_publishable_g4l-OO-1x1X4LMM-c5cnXA_DItmM14F';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>`₹${Number(v||0).toLocaleString('en-IN')}`;const label=k=>String(k).replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase());const clean=v=>{if(v===null||v===undefined||v==='')return '';if(typeof v==='object'){if(Array.isArray(v))return v.map(clean).filter(Boolean).join(', ');return Object.entries(v).filter(([k,x])=>x!==null&&x!==undefined&&x!=='').map(([k,x])=>`${label(k)}: ${clean(x)}`).join(' · ')}return String(v)};const id=new URLSearchParams(location.search).get('id');const app=document.getElementById('app');if(!id){app.innerHTML='<h2>Product not found</h2><a href="./">Back to store</a>';return}try{const H={apikey:K,Authorization:`Bearer ${K}`};const pr=await fetch(`${S}/rest/v1/products?id=eq.${encodeURIComponent(id)}&is_active=eq.true&select=*`,{headers:H});if(!pr.ok)throw Error('Product '+pr.status);const p=(await pr.json())[0];if(!p)throw Error('Product not found');let category={};if(p.category_id){const cr=await fetch(`${S}/rest/v1/categories?id=eq.${encodeURIComponent(p.category_id)}&select=name,slug`,{headers:H});if(cr.ok)category=(await cr.json())[0]||{}}const ir=await fetch(`${S}/rest/v1/product_images?product_id=eq.${encodeURIComponent(id)}&select=image_url,sort_order&order=sort_order.asc`,{headers:H});const imgs=(ir.ok?await ir.json():[]).map(x=>x.image_url).filter(Boolean);const fallback=`<div class="gallery-placeholder"><b>${esc((p.brand||p.name||'R').slice(0,1).toUpperCase())}</b></div>`;const first=imgs[0]?`<img id="mainImg" src="${esc(imgs[0])}" alt="${esc(p.name)}" onerror="this.style.display='none';document.getElementById('ph').style.display='grid'">`:`<div id="ph">${fallback}</div>`;const price=p.sale_price??p.price;const buyMsg=`Hello Raza Mobile & Electronics, I want to buy ${p.name}. Price shown: ${money(price)}. Please confirm availability, final price and buying details.`;const raw=p.specifications&&typeof p.specifications==='object'?p.specifications:{};const entries=Object.entries(raw).filter(([k,v])=>clean(v));const groups=[['Display',entries.filter(([k])=>/display|screen|resolution|refresh|brightness|panel|touch/i.test(k))],['Camera',entries.filter(([k])=>/camera|selfie|video|megapixel|flash/i.test(k))],['Performance',entries.filter(([k])=>/processor|chip|cpu|gpu|ram|performance|os|android|ios/i.test(k))],['Memory & Battery',entries.filter(([k])=>/memory|storage|battery|charging|internal|card/i.test(k))],['Connectivity',entries.filter(([k])=>/wifi|bluetooth|network|sim|usb|nfc|gps|radio/i.test(k))],['Body & Other',entries.filter(([k])=>/body|weight|dimension|color|colour|sound|audio|sensor|misc/i.test(k))])].map(([name,rows])=>[name,rows]).filter(([,rows])=>rows.length);const used=new Set(groups.flatMap(([,rows])=>rows.map(([k])=>k)));const other=entries.filter(([k])=>!used.has(k));if(other.length)groups.push(['More specifications',other]);const facts=[['Brand',p.brand],['Model',p.model],['Storage',p.storage],['Category',category.name],['Condition',p.condition],['Battery health',p.battery_health],['Warranty',p.warranty],['Stock',p.stock>0?`${p.stock} available`:'Out of stock']].filter(x=>x[1]!==null&&x[1]!==undefined&&x[1]!=='');app.innerHTML=`<div class="crumb">Home / ${esc(category.name||'Product')} / ${esc(p.name)}</div><div class="product-layout"><div class="gallery"><div class="main-image">${first}</div><div class="thumbs">${imgs.map((u,i)=>`<button class="thumb ${i===0?'active':''}" data-img="${esc(u)}"><img src="${esc(u)}" alt="${esc(p.name)} ${i+1}"></button>`).join('')}</div></div><div class="details"><div class="eyebrow">${esc(category.name||'RAZA CATALOGUE')}</div><h1 class="title">${esc(p.name)}</h1><p class="subtitle">${esc(p.description||'Genuine product listing from Raza Mobile & Electronics. Check the details below and contact us directly for availability.')}</p><div class="price-line"><div class="price">${money(price)}</div>${p.sale_price&&p.price&&Number(p.sale_price)<Number(p.price)?`<div class="old-price">${money(p.price)}</div>`:''}</div><div class="stock">${p.stock>0?'✓ In stock':'Currently out of stock'}</div><div class="buy"><a class="buy-main" href="https://wa.me/919534715178?text=${encodeURIComponent(buyMsg)}" target="_blank" rel="noopener">Buy on WhatsApp <span>↗</span></a><a class="buy-call" href="tel:+918092067101">Call shop</a></div><div class="quick-grid">${facts.map(([k,v])=>`<div class="quick"><small>${esc(k)}</small><b>${esc(clean(v))}</b></div>`).join('')}</div>${p.description?`<section class="panel"><div class="panel-head"><h2>About this product</h2><span class="panel-tag">Product details</span></div><p class="description">${esc(p.description)}</p></section>`:''}${p.condition||p.damage_notes||p.box_included!==null||p.charger_included!==null?`<section class="panel"><div class="panel-head"><h2>Condition & included items</h2><span class="panel-tag">Buying check</span></div><p class="description">${esc([p.condition?`Condition: ${p.condition}`:'',p.battery_health?`Battery health: ${p.battery_health}`:'',p.damage_notes?`Damage notes: ${p.damage_notes}`:'',p.box_included!==null?`Box included: ${p.box_included?'Yes':'No'}`:'',p.charger_included!==null?`Charger included: ${p.charger_included?'Yes':'No'}`:''].filter(Boolean).join('\n'))}</p></section>`:''}${groups.length?`<section class="panel"><div class="panel-head"><h2>Technical specifications</h2><span class="panel-tag">${entries.length} specifications</span></div><div class="spec-groups">${groups.map(([name,rows])=>`<div class="spec-group"><h3>${esc(name)}</h3>${rows.map(([k,v])=>`<div class="spec-row"><small>${esc(label(k))}</small><b>${esc(clean(v))}</b></div>`).join('')}</div>`).join('')}</div></section>`:''}<div class="trust"><strong>RAZA BUYING ASSISTANCE</strong><br>WhatsApp पर product name और price पहले से तैयार मिलेगा। Final price, availability और buying details shop से confirm कर सकते हैं.</div></div></div>`;document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active');const m=document.getElementById('mainImg'),ph=document.getElementById('ph');if(m){m.src=b.dataset.img;m.style.display='block'}if(ph)ph.style.display='none'});}catch(e){app.innerHTML=`<div style="text-align:center;padding:100px 20px"><h2>Product could not be loaded</h2><p style="color:#777">${esc(e.message)}</p><a href="./" style="display:inline-block;margin-top:20px;background:#111;color:#fff;padding:13px 18px;border-radius:999px;font-weight:800">Back to store</a></div>`}})();
